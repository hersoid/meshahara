[build]
  publish = "."

# Auto-generate content index.json files on every deploy
[[plugins]]
  package = "./plugins/generate-indexes"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
